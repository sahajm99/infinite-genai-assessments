[project]
name = "infinite-genai-assessments"
version = "0.1.0"
description = "Shared rag_core engine + four GenAI assessment apps"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "chromadb>=0.5.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2.0"]
ui = ["streamlit>=1.33"]
redis = ["redis>=5.0"]
local-embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag_core"]
